<app-header></app-header>

<div class="flex bg-[#f4fbff] min-h-screen justify-center items-center px-4">
    <div class="flex flex-col items-center w-full sm:w-3/4 lg:w-2/5 px-4 ml-56 mt-8">
        <!-- Tarjeta principal -->
        <div class="bg-white rounded-lg shadow-lg w-full p-6">
            <!-- Información del paciente -->
            <div class="flex items-center mb-4">
                <!-- Foto del paciente -->
                <div
                    class="w-24 h-24 rounded-full border border-[#ff834d] flex items-center justify-center text-2xl font-semibold text-orange-500">
                    <img src="../../../../assets/images/pollito.png" alt="" class="w-20 h-20 rounded-full">
                </div>
                <div class="ml-4">
                    <h2 class="text-xl font-bold text-blue-900">Nombre Y apellido</h2>
                    <h2 class="text-lg font-semibold text-blue-800">Num_Documento</h2>
                    <!-- <span class="text-sm text-orange-500">Miopía leve</span> -->
                    <div class="flex gap-x-2 items-center text-[#ff834d]">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-activity">
                            <path
                                d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2" />
                        </svg>
                        <p class="text-sm text-gray-600 mt-2">
                            Último seguimiento realizado: 13/11/2024
                        </p>
                    </div>
                </div>
            </div>

            <!-- Progreso del tratamiento -->
            <div class="mt-4">
                <h3 class="text-base font-semibold text-gray-700">Progreso del tratamiento</h3>
                <div class="w-full bg-gray-200 rounded-full h-2.5 mt-2 ">
                    <div class="bg-[#FCBD1B] h-2.5 rounded-full" style="width: 75%;"></div>
                </div>
                <span class="text-sm text-gray-700">75%</span>
            </div>

            <!-- Seguimiento Semanal -->
            <div class="mt-6">
                <div class="flex gap-x-2 items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-list-todo">
                        <rect x="3" y="5" width="6" height="6" rx="1" />
                        <path d="m3 17 2 2 4-4" />
                        <path d="M13 6h8" />
                        <path d="M13 12h8" />
                        <path d="M13 18h8" />
                    </svg>
                    <h3 class="text-base font-semibold">Seguimiento Semanal</h3>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-calendar-days ml-auto cursor-pointer">
                        <path d="M8 2v4" />
                        <path d="M16 2v4" />
                        <rect width="18" height="18" x="3" y="4" rx="2" />
                        <path d="M3 10h18" />
                        <path d="M8 14h.01" />
                        <path d="M12 14h.01" />
                        <path d="M16 14h.01" />
                        <path d="M8 18h.01" />
                        <path d="M12 18h.01" />
                        <path d="M16 18h.01" />
                    </svg>
                </div>

                <!-- Semana 1 -->
                <div class="bg-[#f4fbff] p-4 rounded-lg mb-4 mt-4">
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-semibold text-blue-900">30 Oct - 5 Nov</span>
                        <button class="text-sm text-blue-500 bg-blue-100 rounded-lg px-2 py-1">
                            Ver motivo
                        </button>
                    </div>
                    <p class="text-sm text-gray-700 w-10/12">Aqui van las preguntas</p>
                </div>

                <!-- Semana 2 -->
                <div class="bg-[#f4fbff] p-4 rounded-lg mb-4">
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-semibold text-blue-900">23 Oct - 29 Oct</span>
                        <button class="text-sm text-blue-500 bg-blue-100 rounded-lg px-2 py-1">
                            Ver motivo
                        </button>
                    </div>
                    <p class="text-sm text-gray-700 w-10/12">Aqui van las preguntas</p>
                </div>

                <!-- Semana 3 -->
                <div class="bg-[#f4fbff] p-4 rounded-lg mb-4">
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-semibold text-blue-900">16 Oct - 22 Oct</span>
                        <button class="text-sm text-blue-500 bg-blue-100 rounded-lg px-2 py-1">
                            Ver motivo
                        </button>
                    </div>
                    <p class="text-sm text-gray-700 w-10/12">Aqui van las preguntas</p>
                </div>
            </div>

            <!-- Botones de acción -->
            <div class="flex justify-between mt-6">
                <button class="bg-[#396CB3] text-white font-semibold py-2 px-4 rounded-lg hover:bg-[#497dc7]" [routerLink]="'/paciente'">
                    Volver
                </button>
                <!-- <button class="bg-[#EF7A38] text-white font-semibold py-2 px-4 rounded-lg hover:bg-[#ff834d]">
                    Agregar Seguimiento
                </button> -->
            </div>
        </div>
    </div>
</div>
