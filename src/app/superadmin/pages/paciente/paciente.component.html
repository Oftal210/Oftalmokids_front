<app-header></app-header>

<div class="flex bg-[#f4fbff] min-h-screen justify-center items-center px-4">
    <div class="flex flex-col items-center w-full sm:w-3/4 lg:w-3/4 px-4 ml-56 mt-8">
        <div class="w-full">

            <div class="flex flex-col sm:flex-row justify-between items-center w-full p-4 mb-14 mt-10">
                <p class="text-2xl md:text-4xl font-semibold sm:ml-4 md:ml-0 text-center sm:text-left"> Listado Pacientes </p>
                <!-- Input de buscar -->
                <div class="relative w-full md:max-w-xs ml-auto border h-10 rounded-xl md:mr-14 mr-0">
                    <span class="absolute right-4 top-1/2 transform -translate-y-1/2 cursor-pointer">
                        <i class="fa-solid fa-magnifying-glass" style="color: #00ACC9;"></i>
                    </span>
                    <input type="text" class="w-full h-full pl-4 pr-5 rounded-xl focus:outline-none"
                        [(ngModel)]="inputBusqueda" (input)="filtraPacientesTitulo()"/>
                </div>

                <button (click)="abrirModal()"
                    class="h-10 bg-[#2EBBEE] text-white text-lg font-semibold py-2 px-4 rounded-xl hover:bg-[#15b3ec] focus:outline-none mr-8 md:mr-0 mt-4 sm:mt-0 flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-plus mr-2">
                        <path d="M5 12h14" />
                        <path d="M12 5v14" />
                    </svg>
                    Crear
                </button>
            </div>

            <!-- Contenedor de Tarjetas -->
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
                <!-- Tarjeta de Paciente -->
                <div class="group perspective min-w-[200px] max-w-[240px] w-full h-80"
                    *ngFor="let hijo of pacientesFiltro | paginate: { itemsPerPage: cantreg, currentPage: p }">
                    <div
                        class="relative w-full h-full transition-transform duration-700 transform-style-3d group-hover:rotate-y-180 card-container">
                        <!-- Cara frontal -->
                        <div class="absolute w-full h-full rounded-lg shadow-lg flex flex-col items-center backface-hidden p-5 front-face bg-no-repeat"
                            style="background-image: url('../../../../assets/images/pacientes/fondo_niño.webp');">
                            <img [src]="hijo.foto && hijo.foto !== '' ? 'http://127.0.0.1:8000/storage/' + hijo.foto : '../../../../assets/images/pollito.png'"
                                alt="Foto de {{ hijo.nombre }}" class="w-24 h-24 rounded-full mt-6">
                            <p class="text-lg font-bold mt-6 text-center">{{ hijo.nombre }}</p>
                            <p class="text-lg font-bold mt-[-8px] text-center">{{ hijo.apellido }}</p>
                            <p class="text-gray-600 mt-4">{{ hijo.tipo_documento }}: {{ hijo.documento }}</p>
                            <p class="text-gray-600">Fecha nac: {{ hijo.fecha_nacimiento }}</p>
                        </div>
                        <!-- Cara trasera -->
                        <div class="absolute w-full h-full rounded-lg shadow-lg flex flex-col items-center justify-center backface-hidden p-5 back-face rotate-y-180"
                            style="background-image: url('../../../../assets/images/pacientes/fondo_atras.webp');">
                            <p class="text-lg font-semibold">Edad: {{calcularEdadPaciente(hijo.fecha_nacimiento)}}</p>
                            <!-- Icono de la historica clínica -->
                            <button [routerLink]="['/historia-clinica', hijo.documento]" class="mt-4 hover:bg-[#E1F3FE] flex items-center gap-x-2 py-2 px-2 hover:rounded-lg">
                                Historia clínica:
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                    class="lucide lucide-clipboard-list">
                                    <rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
                                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
                                    <path d="M12 11h4" />
                                    <path d="M12 16h4" />
                                    <path d="M8 11h.01" />
                                    <path d="M8 16h.01" />
                                </svg>
                            </button>
                            <!-- Icono para ver el seguimiento semanal -->
                            <button [routerLink]="['/monitoreo', hijo.documento]" class="mt-2 hover:bg-[#E1F3FE] flex items-center gap-x-2 py-2 px-2 hover:rounded-lg">
                                Seguimiento:
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                    class="lucide lucide-calendar-check-2">
                                    <path d="M8 2v4" />
                                    <path d="M16 2v4" />
                                    <path d="M21 14V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8" />
                                    <path d="M3 10h18" />
                                    <path d="m16 20 2 2 4-4" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            

            <!-- Paginación -->
            <div class="flex justify-center mt-16">
                <pagination-controls (pageChange)="p = $event" previousLabel="Anterior" nextLabel="Siguiente">
                </pagination-controls>
            </div>
        </div>
    </div>
</div>
