<app-header></app-header>

<div class="flex bg-[#f4fbff] min-h-screen justify-center items-center px-4">
  <div class="flex flex-col items-center w-full sm:w-3/4 lg:w-1/2 px-4 ml-56 mt-16">
    <div class="bg-white rounded-lg shadow-lg p-6 w-full" #contenedorPrincipal>

      <!-- Contenedor del título y el botón -->
      <div class="w-full items-center justify-center p-4 flex flex-col">
        <h1 class="text-4xl font-bold text-center mb-4">Bienvenido al Foro </h1>
        <button *ngIf="rolUsuarioActual == 1" class="mt-2 bg-[#EF7A38] text-white rounded-full px-4 py-2 flex items-center gap-x-3"
          (click)="openDialog()">
          <i class="fa-solid fa-plus"></i> Nuevo Tema
        </button>
      </div>

      <!-- Barra de búsqueda -->
      <div class="flex items-center bg-white shadow-sm rounded-lg p-1 mb-6 border w-full mt-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-search ml-2">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>

        <input type="text" placeholder="Buscar temas..." [(ngModel)]="inputBusqueda" (input)="filtraForosTitulo()"
          class="w-full px-4 py-2 text-gray-700 focus:outline-none rounded-full">
      </div>

      <!-- Estilo de las tarjetas del contenido del foro -->
      <div class="overflow-y-auto max-h-[400px] p-4 space-y-4 rounded-lg">
        <div *ngFor="let item of forosFiltro; let i = index" class="p-4 rounded-lg shadow-md mb-4 border border-[#c5e6fa] cursor-pointer" (click)="editarForoModal(item)">

          <div class="flex justify-between items-center text-[#ff834d]">
            <!-- Título del tema -->
            <h2 class="text-lg font-semibold text-blue-700"> {{ item.subtitulo_foro }} 
              <i *ngIf="rolUsuarioActual == 1" class="bi bi-pencil-square cursor-pointer" (click)="editarForoModal(item)"></i>
              <i *ngIf="rolUsuarioActual == 2" class="bi bi-eye cursor-pointer" ></i>
            </h2>
            <div class="flex gap-x-2">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" 
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" 
                class="lucide lucide-thumbs-up cursor-pointer" (click)="enviarLikeForo(item.id)">
                <path d="M7 10v12" />
                <path
                  d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z" />
              </svg><p [attr.id]="'like-' + item.id" >{{ item.likes_count }}</p>
            </div>
          </div>

          <!-- Contenido del foro -->
          <i class="fa-regular fa-calendar text-blue-500 mr-2 mt-2"></i>{{formatDate(item.created_at)}}
          <p class="mt-2 truncate">{{ item.contenido_foro }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
