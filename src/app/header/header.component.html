<!-- Este archivo contiene el encabezado -->
<header class="w-full h-20 fixed top-0 left-0 z-40 flex justify-between items-center md:h-20 border-b border-gray-200 bg-white shadow-md">
    <div class="flex items-center px-4 md:px-8">
        <img src="../../assets/images/logo_sin_fondo.png" alt="logo" class="h-16 w-auto">
    </div>

    <div class="flex items-center space-x-6 mr-10">
        <!-- Botón y campana -->
        <i *ngIf="user.id_rol == 2" class="fa-regular fa-bell fa-lg cursor-pointer" (click)="toggleDropdownCampanita()"></i>
        <span *ngIf="cantidadCampanita > 0 && user.id_rol == 2" 
            class="absolute top-[43px] right-[110px] bg-red-500 text-white text-xs rounded-full w-4 h-4 flex items-center justify-center transform translate-x-2 -translate-y-2">
            {{cantidadCampanita}}
        </span>
        <div class="flex items-center space-x-2 cursor-pointer" (click)="toggleDropdown()">
            <i class="fa-solid fa-circle-user text-2xl"></i>
        </div>

        <!-- Menú desplegable de notificaciones -->
        <div *ngIf="dropDownCampa" class="absolute right-20 top-1 mt-12 md:mt-12 mr-4 w-56 bg-white rounded-lg shadow-lg z-50 overflow-y-auto" style="max-height: 20rem;">
            <p class="text-gray-700 px-4 py-2 border-b font-semibold text-center">Notificaciones</p>
            
            <div *ngFor="let noti of notifi; let i = index" class="px-4 py-2 border-b-2 cursor-pointer" [class.border-b-2]="i !== notifi.length - 1"
                (click)="irForo()" >
                <!-- Nuevo Foro -->
                <div class="flex justify-between items-center pb-2 border-b border-gray-300 w-[90%] mx-auto">
                    <span class="text-gray-700 font-semibold text-xs">Nuevo Foro</span>
                    <span class="text-gray-500 text-xs">{{formatDate(noti.created_at)}}</span> 
                </div>
                <!-- Texto del foro -->
                <p class="text-gray-700 pt-2 w-11/12 truncate"> {{noti.mensaje}} </p>
            </div>

            <div class="flex items-center border-t py-1  w-full text-red-600"></div>
        </div>

        <!-- Menú desplegable de perfil y cerrar sesión -->
        <div *ngIf="showDropdown" class="absolute right-0 mt-40 md:mt-40 mr-4 w-48 bg-white rounded-lg shadow-lg z-50">
            <p class="text-gray-700 px-4 py-2 border-b font-semibold text-center">{{user?.nombre}}</p>
            <button [routerLink]="user?.id_rol === 1 ? '/perfil' : '/perfil-padre'" class="flex items-center px-4 py-2 hover:bg-gray-100 w-full">
                <i class="fa-solid fa-user text-gray-500 mr-2"></i> Perfil
            </button>
            <button class="flex items-center px-4 py-2 hover:bg-gray-100 w-full text-red-600" (click)="cerrarSesion()">
                <i class="fa-solid fa-right-from-bracket text-red-600 mr-2"></i> Cerrar Sesión
            </button>
        </div>
    </div>
</header>
