<!-- Este archivo contiene el encabezado -->
<div class="w-full h-[4rem] fixed border-b border-gray-200 bg-white z-10 items-center flex">
    <div class="flex items-center justify-end w-full px-4 md:px-8">
        <!-- Botón y campana -->
        <i class="fa-regular fa-bell fa-lg cursor-pointer mr-6"></i>
        <div class="flex items-center space-x-2 cursor-pointer" (click)="toggleDropdown()">
            <i class="fa-solid fa-circle-user text-2xl"></i>
            <p class="hidden md:block text-gray-700">Nombre Usuario</p>
        </div>

        <!-- Menú desplegable de perfil y cerrar sesión -->
        <div *ngIf="showDropdown" class="absolute right-0 mt-40 md:mt-40 mr-4 w-48 bg-white rounded-lg shadow-lg z-50">
            <p class="text-gray-700 px-4 py-2 border-b font-semibold text-center">BIENVENIDO!</p>
            <button [routerLink]="'/perfil'" class="flex items-center px-4 py-2 hover:bg-gray-100 w-full">
                <i class="fa-solid fa-user text-gray-500 mr-2"></i> Perfil
            </button>
            <button class="flex items-center px-4 py-2 hover:bg-gray-100 w-full">
                <i class="fa-solid fa-right-from-bracket text-gray-500 mr-2"></i> Cerrar Sesión
            </button>
        </div>
    </div>
</div>
